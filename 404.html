<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Farmers First Agri Service</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#08080c;--panel:#0d0d14;--card:#12121a;--border:#1e1e2a;--accent:#d4a942;--text:#c8c8d4;--dim:#5a5a70;--bright:#fff}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
        header{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 20px}
        .header-inner{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
        .logo{font-family:'JetBrains Mono',monospace;font-size:1.4rem;font-weight:700;color:var(--bright);text-decoration:none}
        .logo span{color:var(--accent)}
        .cta-btn{background:var(--accent);color:var(--bg);padding:10px 18px;text-decoration:none;font-weight:600}
        main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 20px;text-align:center}
        .error-box{max-width:500px}
        .error-code{font-family:'JetBrains Mono',monospace;font-size:6rem;color:var(--accent);line-height:1;margin-bottom:20px}
        h1{font-family:'JetBrains Mono',monospace;font-size:1.5rem;color:var(--bright);margin-bottom:16px}
        p{color:var(--dim);margin-bottom:30px}
        .links{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
        .links a{color:var(--accent);text-decoration:none;padding:12px 20px;border:1px solid var(--border);transition:.2s}
        .links a:hover{border-color:var(--accent);background:var(--card)}
        footer{border-top:1px solid var(--border);padding:20px;text-align:center;font-size:.75rem;color:var(--dim)}
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="/" class="logo">🌾 FARMERS<span>FIRST</span></a>
            <a href="tel:715-553-0392" class="cta-btn">📞 715-553-0392</a>
        </div>
    </header>
    <main>
        <div class="error-box">
            <div class="error-code">404</div>
            <h1>Page Not Found</h1>
            <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
            <div class="links">
                <a href="/">← Back to Home</a>
                <a href="/#areas">Service Areas</a>
                <a href="tel:715-553-0392">Call Us</a>
            </div>
        </div>
    </main>
    <footer>© 2017–2025 Farmers First Agri Service • Chetek, Wisconsin</footer>
</body>
</html>
