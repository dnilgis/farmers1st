# FFAI quarterly update. Run from the Actions tab: "FFAI quarterly update" > Run workflow.
#   preview  = run the FFAI v4 engine (USDA NASS) and show the new scores. Changes nothing.
#   publish  = same, then write the v4 numbers into the site and commit to main.
#              (FFAI v3 is retired and frozen; nothing here updates it.)
#   experiment = score the data several alternative ways and compare them. Changes nothing.
#   probe    = list the national USDA and FRED series available for FFAI v4 and save them to
#              engine/v4probe/ in the repo. The website is unchanged.
#   v4       = build FFAI v4 and run its pre-registered validation; saves to engine/v4/. Website unchanged.
# Repository secrets (Settings > Secrets and variables > Actions): NASS_API_KEY and FRED_API_KEY (FRED is used for v4 validation).
name: FFAI quarterly update

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = show results only. publish = update the website. experiment = compare scoring methods. probe = list v4 data. v4 = build and validate v4."
        type: choice
        options: [preview, publish, experiment, probe, v4]
        default: preview

permissions:
  contents: write
  pages: write

concurrency:
  group: ffai-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Versions pinned to the ones this was tested with (Oct 2026).
      - name: Install libraries
        run: pip install fredapi==0.5.2 pandas==3.0.6 numpy==2.5.3 scipy==1.18.1 matplotlib==3.11.2 pillow==12.3.0

      - name: Run FFAI v4 engine (pulls USDA NASS, validates against FRED)
        if: inputs.mode == 'preview' || inputs.mode == 'publish'
        working-directory: engine
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python -u ffai_v4.py

      - name: Write v4 numbers into the site files
        if: inputs.mode == 'preview' || inputs.mode == 'publish'
        run: python tools/ffai_v4_publish.py

      - name: Experiment (compare scoring methods, publishes nothing)
        if: inputs.mode == 'experiment'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -u tools/ffai_experiment.py

      - name: Probe v4 data sources (publishes nothing)
        if: inputs.mode == 'probe'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python -u tools/ffai_v4_probe.py

      - name: Build FFAI v4 and run its validation (website unchanged)
        if: inputs.mode == 'v4'
        working-directory: engine
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python -u ffai_v4.py

      - name: Keep engine output with the run
        uses: actions/upload-artifact@v4
        with:
          name: ffai-engine-output
          path: |
            og-share.png
            ffai-v4.js
            api/v4/
            engine/experiment/
            engine/v4probe/
            engine/v4/
          if-no-files-found: ignore

      - name: Commit to main
        if: inputs.mode == 'publish'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ffai-v4.js api/v4/ index.html og-share.png sitemap.xml engine/v4/
          if git diff --cached --quiet; then
            echo "No changes to publish." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          Q=$(python -c "import json;print(json.load(open('api/v4/current.json'))['quarter'])")
          git commit -m "FFAI data update: $Q (run ${{ github.run_number }})"
          git pull --rebase origin main
          git push
          echo "Published $Q to main." >> "$GITHUB_STEP_SUMMARY"

      # Pushes made with the workflow token normally start the Pages build on
      # their own. This asks for one anyway; harmless if it is not needed.
      - name: Save probe or v4 output to the repo (website unchanged)
        if: inputs.mode == 'probe' || inputs.mode == 'v4'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/v4probe/ engine/v4/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing to save."; exit 0; fi
          git commit -m "FFAI ${{ inputs.mode }} output (run ${{ github.run_number }})"
          git pull --rebase origin main
          git push

      - name: Ask GitHub Pages to rebuild
        if: inputs.mode == 'publish'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
